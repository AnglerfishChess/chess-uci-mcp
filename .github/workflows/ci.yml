# The engine install is load-bearing. Without a UCI binary on PATH, tests/test_engines.py skips itself at module
# level and the whole suite passes having run nothing -- a green tick that vouches for absolutely nothing. Linux
# is also the platform the maintainer does not develop on, which is most of what this job buys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # Overrides the .python-version pin the working copy carries, for every uv step below rather than just
    # the sync -- uv otherwise rebuilds the environment at the pinned version under the first `uv run`.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Ubuntu's universe repo carries Stockfish prebuilt, so this costs seconds and no compiler. `command -v` is
      # the guard that matters: with the binary on PATH the module-level skip cannot fire, so a green suite below
      # is a suite that genuinely drove an engine.
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          command -v stockfish

      - run: uv sync --extra=dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check

      # The version is repeated in __init__.py and twice in server.json; this fails the build when a copy drifts
      # from pyproject.toml rather than letting a mislabelled wheel reach PyPI.
      - run: uv run python .claude/skills/releasing/scripts/sync_version.py --check

      - run: uv run pytest -q
